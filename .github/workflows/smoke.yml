name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC, so breakage in upstream packages shows up

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # Test values only: real keys come from a secrets store
      MEDICAL_CART_ENCRYPTION_KEY: ci-test-passphrase
      MEDICAL_CART_PSEUDONYM_KEY: ci-test-pseudonym-key
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Smoke test
        run: make smoke
      # README "Run it", steps 2 to 5, as written (the keys are set above, as in step 3)
      - name: Run it, step 2 (make run)
        run: |
          set -o pipefail
          make run 2>&1 | tee /tmp/run.txt
          grep -q "PHI redaction verified - 111073 patient, doctor and hospital names looked for, 0 found" /tmp/run.txt
          grep -q "Journey Status: DELIVERED_WITH_WARNINGS" /tmp/run.txt
          grep -q "Pipeline finished: PASS WITH WARNINGS" /tmp/run.txt
      - name: Run it, steps 3 to 5 (decrypt, verify, tamper demo, another role)
        run: |
          set -o pipefail
          make pipeline 2>&1 | tee /tmp/pipeline.txt
          grep -q "Encryption at rest - 1 file(s) encrypted; each one decrypts back to its content" /tmp/pipeline.txt
          uv run python security_module.py decrypt staged_data/secure/healthcare_redacted.csv.enc > /tmp/decrypt_all.txt && head -3 /tmp/decrypt_all.txt | tee /tmp/decrypt.txt
          grep -q "^Patient ID,Age,Gender" /tmp/decrypt.txt
          grep -q "^PATIENT_" /tmp/decrypt.txt
          make verify | tee /tmp/verify.txt
          grep -q "Lineage ledger: VALID" /tmp/verify.txt
          make tamper-demo | tee /tmp/tamper.txt
          grep -q "After editing: BROKEN at event 5" /tmp/tamper.txt
          uv run python medical_cart_pipeline.py --user-role cart_operator --mode pipeline 2>&1 | tee /tmp/role.txt
          grep -q "cart_operator write healthcare_data" /tmp/role.txt
      - name: Use your own data (file checks)
        run: uv run --frozen pytest -q tests/test_own_data.py
      - name: Try this 1 to 3
        run: |
          set -o pipefail
          make try-k-anonymity | tee /tmp/t1.txt
          grep -qE "^both of the last two +20 +7 +0" /tmp/t1.txt
          make try-fairness-skew | tee /tmp/t2.txt
          grep -qE "20% \(as is\) .* pass" /tmp/t2.txt
          make try-sensor-noise | tee /tmp/t3.txt
          grep -qE "^clean data \(the pipeline\) +0\.2355" /tmp/t3.txt
      - name: Full run and lineage checks (shown in the README)
        run: |
          uv run python medical_cart_pipeline.py
          uv run python verify_lineage.py
          uv run python verify_lineage.py --tamper-demo
      - name: Printed commands (pip install -r requirements.txt, every documented option)
        run: |
          uv venv --seed --python ${{ matrix.python-version }} /tmp/pipenv
          /tmp/pipenv/bin/python -m pip install -q -r requirements.txt
          /tmp/pipenv/bin/python medical_cart_pipeline.py --help
          /tmp/pipenv/bin/python medical_cart_pipeline.py
          /tmp/pipenv/bin/python medical_cart_pipeline.py --user-role medical_staff
          /tmp/pipenv/bin/python medical_cart_pipeline.py --mode pipeline
          /tmp/pipenv/bin/python medical_cart_pipeline.py --mode journey
          /tmp/pipenv/bin/python medical_cart_pipeline.py --verbose > /dev/null
          /tmp/pipenv/bin/python medical_cart_pipeline.py --user-role admin --verbose > /dev/null
          /tmp/pipenv/bin/python medical_cart_pipeline.py --user-role cart_operator --mode pipeline
          /tmp/pipenv/bin/python medical_cart_pipeline.py --user-role auditor --mode pipeline
          /tmp/pipenv/bin/python medical_cart_pipeline.py --mode pipeline --user-role medical_staff
          /tmp/pipenv/bin/python medical_cart_pipeline.py --mode journey --user-role medical_staff
          git diff --exit-code

  devcontainer:
    # Builds .devcontainer/ the way Codespaces does and runs the playbook inside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the devcontainer and run the playbook
        uses: devcontainers/ci@v0.3
        with:
          push: never
          # The first output command, timed, as a reader would see it in a new Codespace
          runCmd: start=$(date +%s) && make run && echo "Time to first output in a clean devcontainer was $(( $(date +%s) - start )) s"
